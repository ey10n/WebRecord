<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebRecord</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WebRecord">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f4f4f6; --card: #fff; --text: #111; --sub: #6b6b72;
    --accent: #e5322d; --accent-text: #fff; --line: #e2e2e6; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --card: #1c1c1e; --text: #f2f2f2; --sub: #9a9aa0; --line: #2c2c2e; --err: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none;
  }
  main { width: 100%; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
  button {
    appearance: none; border: 0; border-radius: 16px; width: 100%;
    padding: 22px 16px; font: inherit; font-size: 19px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    -webkit-tap-highlight-color: transparent; cursor: pointer;
  }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .35; cursor: default; }
  #pick { background: var(--accent); color: var(--accent-text); }
  #save { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: currentColor; }
  #status { min-height: 1.5em; text-align: center; color: var(--sub); font-size: 15px; }
  #status.err { color: var(--err); }
  progress { width: 100%; height: 6px; appearance: none; border: 0; border-radius: 3px; background: var(--line); overflow: hidden; }
  progress::-webkit-progress-bar { background: var(--line); }
  progress::-webkit-progress-value { background: var(--accent); }
  audio { width: 100%; }
  [hidden] { display: none !important; }
  details { color: var(--sub); font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  summary { cursor: pointer; }
  ol { padding-left: 1.3em; margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>WebRecord</h1>

  <button id="pick"><span class="dot"></span>録音した動画を選ぶ</button>
  <input id="file" type="file" accept="video/*,audio/*" hidden>

  <progress id="bar" max="1" value="0" hidden></progress>
  <div id="status"></div>
  <audio id="preview" controls hidden></audio>

  <button id="save" disabled>MP3を保存</button>

  <details>
    <summary>使い方</summary>
    <ol>
      <li>コントロールセンターの「画面収録」で、ブラウザの音を再生しながら収録</li>
      <li>「録音した動画を選ぶ」で収録した動画を選択（前後の無音は自動でカット）</li>
      <li>「MP3を保存」→「"ファイル"に保存」</li>
    </ol>
  </details>
</main>
<script src="app.js"></script>
</body>
</html>
